name: Docker Compose Security Tests

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      dvwa:
        image: ghcr.io/digininja/dvwa:latest
        env:
          DB_SERVER: db
          DB_PORT: 3306
          DB_DATABASE: dvwa
          DB_USERNAME: dvwa
          DB_PASSWORD: p@ssw0rd
          RECAPTCHA_PRIV_KEY: ""
          RECAPTCHA_PUB_KEY: ""
        options: >-
          --health-cmd "curl -f http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8080:80
      
      db:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: dvwa
          MYSQL_USER: dvwa
          MYSQL_PASSWORD: p@ssw0rd
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Wait for DVWA to be ready
        run: |
          max_attempts=30
          attempt=0
          target_url="http://localhost:8080"
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "$target_url" > /dev/null 2>&1; then
              echo "✓ DVWA is ready"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for DVWA... (attempt $attempt/$max_attempts)"
            sleep 2
          done
          
          echo "✗ DVWA failed to start"
          exit 1
      
      - name: Run security tests
        env:
          TARGET_URL: http://localhost:8080
          HEADLESS: "true"
        run: |
          python -m pytest security_tests/ \
            --html=reports/pytest_report.html \
            --json-report \
            --json-report-file=reports/pytest_report.json \
            --junit-xml=reports/junit_results.xml \
            -v
        continue-on-error: true
      
      - name: Generate security report
        if: always()
        run: |
          python scripts/generate_report.py
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: reports/
          retention-days: 30
      
      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/pytest_report.json';
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const summary = report.summary || {};
              
              const comment = `## 🔒 Security Test Results
              
              - ✅ Passed: ${summary.passed || 0}
              - ❌ Failed: ${summary.failed || 0}
              - ⏭️ Skipped: ${summary.skipped || 0}
              
              📊 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
        continue-on-error: true
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            reports/junit_results.xml
          check_name: Security Test Results
        continue-on-error: true
