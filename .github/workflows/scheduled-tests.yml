name: Scheduled Security Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      dvwa:
        image: ghcr.io/digininja/dvwa:latest
        env:
          DB_SERVER: db
          DB_PORT: 3306
          DB_DATABASE: dvwa
          DB_USERNAME: dvwa
          DB_PASSWORD: p@ssw0rd
          RECAPTCHA_PRIV_KEY: ""
          RECAPTCHA_PUB_KEY: ""
        options: >-
          --health-cmd "curl -f http://localhost:80 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8080:80
      
      db:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: dvwa
          MYSQL_USER: dvwa
          MYSQL_PASSWORD: p@ssw0rd
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Wait for DVWA to be ready
        run: |
          max_attempts=30
          attempt=0
          target_url="http://localhost:8080"
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s "$target_url" > /dev/null 2>&1; then
              echo "✓ DVWA is ready"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for DVWA... (attempt $attempt/$max_attempts)"
            sleep 2
          done
          
          echo "✗ DVWA failed to start"
          exit 1
      
      - name: Run comprehensive security tests
        env:
          TARGET_URL: http://localhost:8080
          HEADLESS: "true"
        run: |
          python -m pytest security_tests/ \
            --html=reports/pytest_report.html \
            --json-report \
            --json-report-file=reports/pytest_report.json \
            --junit-xml=reports/junit_results.xml \
            -v --tb=short
        continue-on-error: true
      
      - name: Generate security report
        if: always()
        run: |
          python scripts/generate_report.py
        continue-on-error: true
      
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scheduled-security-reports
          path: reports/
          retention-days: 90
      
      - name: Send summary to job summary
        if: always()
        run: |
          echo "## 🔍 Daily Security Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/pytest_report.json ]; then
            python -c "
            import json
            with open('reports/pytest_report.json') as f:
              data = json.load(f)
              summary = data.get('summary', {})
              print(f'- ✅ Passed: {summary.get(\"passed\", 0)}')
              print(f'- ❌ Failed: {summary.get(\"failed\", 0)}')
              print(f'- ⏭️ Skipped: {summary.get(\"skipped\", 0)}')
            " >> $GITHUB_STEP_SUMMARY
          fi
