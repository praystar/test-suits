# ============================================================
# DVWA — Damn Vulnerable Web Application
# Local target for security test framework
#
# Usage:
#   docker compose up -d
#   # Wait ~15s for DB init, then:
#   open http://localhost:8080
#   # Login: admin / password
#   # Click "Create / Reset Database" button once
#   # Then run: bash run_tests.sh all
#
# Tear down:
#   docker compose down -v
# ============================================================

services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    environment:
      DB_SERVER: db
      DB_PORT: 3306
      DB_DATABASE: dvwa
      DB_USERNAME: dvwa
      DB_PASSWORD: p@ssw0rd
      RECAPTCHA_PRIV_KEY: ""
      RECAPTCHA_PUB_KEY: ""
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - dvwa_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dvwa_db:
